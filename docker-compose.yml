services:
  postgres:
    image: postgres:16
    container_name: money-weather-postgres
    environment:
      POSTGRES_DB: moneyweather
      POSTGRES_USER: moneyweather
      POSTGRES_PASSWORD: moneyweather
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
