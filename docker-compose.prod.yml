# 홈서버 배포용: 앱 + PostgreSQL.
#
#   cp .env.example .env        # 비밀값 채우기
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 개발 PC 에서 PostgreSQL 만 띄울 때는 docker-compose.yml 을 쓴다.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: moneyweather
      POSTGRES_USER: moneyweather
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 설정하세요}
      TZ: Asia/Seoul
    volumes:
      # 컨테이너를 지우고 다시 만들어도 데이터는 이 볼륨에 남는다
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyweather -d moneyweather"]
      interval: 5s
      timeout: 5s
      retries: 12
    # ports 를 열지 않는다: DB 는 같은 compose 네트워크의 앱만 접근한다

  app:
    build: .
    image: money-weather-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/moneyweather
      DB_USERNAME: moneyweather
      DB_PASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 설정하세요}
      JWT_SECRET: ${JWT_SECRET:?.env 에 JWT_SECRET 을 설정하세요 (16자 이상)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:3000}
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-none}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo1234!}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      TZ: Asia/Seoul
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  db-data:
