spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moneyweather}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:moneyweather}
    password: ${DB_PASSWORD:moneyweather}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
